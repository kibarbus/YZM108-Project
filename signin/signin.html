<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - UnBoxed Pages</title>
    <link rel="stylesheet" href="../index/index.css">
    <link rel="stylesheet" href="signin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo" onclick="window.location.href='../index/index.html'">
            <i class="fa-solid fa-box-open"></i>
            <span>UnBoxed Pages</span>    
        </div>
        <nav class="nav-links">
            <a href="../story/story.html">OUR STORY</a>
            <a href="../boxes/boxes.html">BOXES</a>
            <a href="../FAQ/FAQ.html">FAQ</a>
            <a href="../signin/signin.html" class="login-btn">LOGIN</a>
        </nav>
        <div class="nav-actions">
            <a href="../signin/subscribe.html" class="subscribe-nav-btn">SUBSCRIBE</a>
            <a href="../cart/cart.html" class="cart-icon">
                <i class="fa-solid fa-shopping-cart"></i>
                <span class="cart-badge" id="cart-badge">1</span>
            </a>
        </div>
    </header>

    <div class="account-header">
        <h1>MY ACCOUNT</h1>
    </div>

    <main class="login-wrapper">
        <div class="tab-menu">
            <button class="tab-btn active">Sign In</button>
            <button class="tab-btn">Register</button>
        </div>

        <div class="form-box">
            <form>
                <div class="form-input-group">
                    <label>E-MAIL *</label>
                    <input type="email" placeholder="Enter your email address" required>
                </div>
                <div class="form-input-group">
                    <label>PASSWORD *</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <div class="action-row">
                    <button type="submit" class="submit-login-btn">SIGN IN</button>
                    <a href="#" class="forgot-pass">Forgot Password?</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 UnBoxed Pages Book Community. All Rights Reserved.</p>
            <div class="footer-links">
                <a href="../story/story.html">Our Story</a> / 
                <a href="../faq/faq.html">FAQ</a> / 
                <a href="../subscribe/subscribe.html">Subscribe</a>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const badge = document.getElementById('cart-badge');
            if (badge) {
                let cart = JSON.parse(localStorage.getItem('unboxed_cart')) || [];
                badge.innerText = cart.length;
            }
        });
    </script>

</body>
</html>
